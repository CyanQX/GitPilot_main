# ============================================================
# GitPilot — secret detection rules (externalized configuration)
# Updating rules requires no code changes — only edit this file
# ============================================================

# ---- High-risk filenames ----
high_risk_files:
  - pattern: "\\.env$"
    reason: "Environment variable file"
  - pattern: "\\.env\\.\\w+$"
    reason: "Environment variable file (per environment)"
  - pattern: "\\.pem$"
    reason: "PEM key file"
  - pattern: "\\.key$"
    reason: "Private key file"
  - pattern: "\\.p12$"
    reason: "PKCS12 certificate"
  - pattern: "\\.pfx$"
    reason: "PFX certificate"
  - pattern: "\\.keystore$"
    reason: "Java keystore"
  - pattern: "\\.jks$"
    reason: "Java keystore"
  - pattern: "credentials\\.json$"
    reason: "Cloud service credentials file"
  - pattern: "service-account\\.json$"
    reason: "Service account key"
  - pattern: "secrets\\.ya?ml$"
    reason: "Secrets configuration file"
  - pattern: "id_rsa$"
    reason: "SSH private key"
  - pattern: "id_ed25519$"
    reason: "SSH private key"
  - pattern: "id_ecdsa$"
    reason: "SSH private key"

# ---- Medium-risk filenames ----
medium_risk_files:
  - pattern: "\\.token$"
    reason: "Token file"
  - pattern: "\\.secret$"
    reason: "Secret file"
  - pattern: "\\.npmrc$"
    reason: "npm auth configuration"
  - pattern: "\\.pypirc$"
    reason: "PyPI auth configuration"
  - pattern: "\\.dockercfg$"
    reason: "Docker auth configuration"
  - pattern: "\\.git-credentials$"
    reason: "Git credentials file"
  - pattern: "\\.netrc$"
    reason: "Network credentials file"

# ---- Content detection rules ----
content_patterns:
  # API Keys
  - pattern: "(?:api[_-]?key|apikey|api[_-]?secret)\\s*[:=]\\s*['\"][^'\"]+['\"]"
    type: "API Key"
    severity: high

  - pattern: "sk-[a-zA-Z0-9]{32,}"
    type: "OpenAI API Key"
    severity: high

  - pattern: "ghp_[a-zA-Z0-9]{36}"
    type: "GitHub Personal Access Token"
    severity: high

  - pattern: "github[_-]?token\\s*[:=]\\s*['\"][^'\"]+['\"]"
    type: "GitHub Token"
    severity: high

  # AWS
  - pattern: "AKIA[0-9A-Z]{16}"
    type: "AWS Access Key"
    severity: high

  - pattern: "(?:aws[_-]?secret|aws[_-]?access[_-]?key[_-]?id)\\s*[:=]\\s*['\"][^'\"]+['\"]"
    type: "AWS Credential"
    severity: high

  # Private Keys
  - pattern: "-----BEGIN (?:RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----"
    type: "Private Key"
    severity: high

  - pattern: "-----BEGIN PGP PRIVATE KEY BLOCK-----"
    type: "PGP Private Key"
    severity: high

  # Connection Strings
  - pattern: "(?:mongodb|mysql|postgres|redis|sqlserver)://[^/\\s]+:[^/\\s]+@"
    type: "Database Connection String"
    severity: high

  - pattern: "jdbc:[a-z]+://[^/\\s]+"
    type: "JDBC Connection String"
    severity: high

  # Auth Tokens
  - pattern: "(?:jwt|bearer|auth[_-]?token)\\s*[:=]\\s*['\"][^'\"]{20,}['\"]"
    type: "Auth Token"
    severity: high

  # Passwords
  - pattern: "(?:password|passwd|pwd)\\s*[:=]\\s*['\"][^'\"]{3,}['\"]"
    type: "Password"
    severity: medium
